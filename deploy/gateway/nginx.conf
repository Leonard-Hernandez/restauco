# Single public origin for the whole stack (same routes as the k8s ingress):
#   /restauco-api -> API, /authco -> authco, / -> SPA
server {
    listen 80;
    server_name _;
    # Dish photos are up to 5 MB
    client_max_body_size 6m;

    # Docker DNS, re-resolved so recreated containers (new IPs) never leave stale upstreams
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://restauco-api:8089;
    set $authco http://authco:8087;
    set $app http://restauco-app:80;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Behind a TLS tunnel the original scheme arrives in X-Forwarded-Proto
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_host;

    # Live updates (Server-Sent Events): no buffering, long-lived connections
    location ~ ^/restauco-api/api/(panel/stream|public/tables/[^/]+/stream) {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    # MCP discovery at the origin root (RFC 9728 / RFC 8414 path insertion):
    #   /.well-known/oauth-protected-resource/restauco-api/... -> the API's metadata of that path
    #   /.well-known/oauth-authorization-server/authco         -> authco's metadata
    location ~ ^/\.well-known/oauth-protected-resource/restauco-api(/[a-z0-9/-]*)?$ {
        proxy_pass $api/restauco-api/.well-known/oauth-protected-resource$1;
    }
    location = /.well-known/oauth-authorization-server/authco {
        proxy_pass $authco/authco/.well-known/oauth-authorization-server;
    }
    location = /.well-known/openid-configuration/authco {
        proxy_pass $authco/authco/.well-known/openid-configuration;
    }

    location /restauco-api/ {
        proxy_pass $api;
    }

    location /authco/ {
        proxy_pass $authco;
    }

    location / {
        proxy_pass $app;
    }
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
