# Single public origin for the whole stack (same routes as the k8s ingress):
#   /restauco-api -> API, /authco -> authco, / -> SPA
server {
    listen 80;
    # Only for the Cloudflare tunnel: not published on the host, see $client_ip
    listen 8080;
    server_name _;
    # Dish photos are up to 5 MB
    client_max_body_size 6m;

    # Docker DNS, re-resolved so recreated containers (new IPs) never leave stale upstreams
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://restauco-api:8089;
    set $authco http://authco:8087;
    set $app http://restauco-app:80;

    proxy_set_header Host $http_host;
    # Replaced, never appended: the API trusts X-Forwarded-For and rate limits by it
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    # Behind a TLS tunnel the original scheme arrives in X-Forwarded-Proto
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_host;

    # Live updates (Server-Sent Events): no buffering, long-lived connections
    location ~ ^/restauco-api/api/(panel/stream|public/tables/[^/]+/stream) {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    # MCP discovery at the origin root (RFC 9728 / RFC 8414 path insertion):
    #   /.well-known/oauth-protected-resource/restauco-api/... -> the API's metadata of that path
    #   /.well-known/oauth-authorization-server/authco         -> authco's metadata
    location ~ ^/\.well-known/oauth-protected-resource/restauco-api(/[a-z0-9/-]*)?$ {
        proxy_pass $api/restauco-api/.well-known/oauth-protected-resource$1;
    }
    location = /.well-known/oauth-authorization-server/authco {
        proxy_pass $authco/authco/.well-known/oauth-authorization-server;
    }
    location = /.well-known/openid-configuration/authco {
        proxy_pass $authco/authco/.well-known/openid-configuration;
    }

    location /restauco-api/ {
        proxy_pass $api;
    }

    location /authco/ {
        proxy_pass $authco;
    }

    location / {
        proxy_pass $app;
    }
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# The visitor's address, as the API sees it. Port 80 is the one published on the host: whoever
# connects is the client, and any X-Forwarded-For / CF-Connecting-IP they send is dropped.
# Port 8080 is only reachable inside the Docker networks, where cloudflared forwards the tunnel;
# there CF-Connecting-IP is the visitor, set by Cloudflare's edge (which overwrites any copy the
# visitor sends).
map "$server_port:$http_cf_connecting_ip" $client_ip {
    "~^8080:(?<cf_client>[0-9A-Fa-f:.]+)$" $cf_client;
    default $remote_addr;
}
