apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: restauco
  name: restauco
spec:
  # Keep 1 replica: live updates (SSE) fan out in memory. Scaling out needs
  # Postgres LISTEN/NOTIFY in SseHub first.
  replicas: 1
  selector:
    matchLabels:
      app: restauco
  strategy: {}
  template:
    metadata:
      labels:
        app: restauco
    spec:
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"]
      containers:
      - image: leonard20/restauco:latest
        imagePullPolicy: IfNotPresent
        name: restauco
        ports:
        - containerPort: 8089
        env:
        - name: DB_URL
          valueFrom:
            configMapKeyRef:
              name: restauco
              key: db_url
        - name: USER_DB
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: username
        - name: PASSWORD_DB
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        - name: AUTHCO_ISSUER
          valueFrom:
            configMapKeyRef:
              name: restauco
              key: authco_issuer
        - name: AUTHCO_INTERNAL_URL
          valueFrom:
            configMapKeyRef:
              name: restauco
              key: authco_internal_url
        - name: RESTAUCO_RESOURCE_ID
          valueFrom:
            configMapKeyRef:
              name: restauco
              key: restauco_resource_id
        - name: CORS_ALLOWED_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: restauco
              key: cors_allowed_origins
        - name: BOOTSTRAP_OWNER_EMAIL
          valueFrom:
            secretKeyRef:
              name: restauco-secret
              key: bootstrap_owner_email
        - name: BOOTSTRAP_TENANT
          valueFrom:
            configMapKeyRef:
              name: restauco
              key: bootstrap_tenant
        - name: RESTAUCO_UPLOADS
          value: /data/uploads
        volumeMounts:
        - name: uploads
          mountPath: /data/uploads
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /restauco-api/actuator/health/liveness
            port: 8089
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /restauco-api/actuator/health/readiness
            port: 8089
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /restauco-api/actuator/health/liveness
            port: 8089
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: uploads-pvc
