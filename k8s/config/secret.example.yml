# Copy to secret.yml (git-ignored) and fill in real values:
#   cp k8s/config/secret.example.yml k8s/config/secret.yml
#   echo -n 'real-value' | base64 -w0
# or regenerate with `kubectl create secret generic ... --dry-run=client -o yaml`.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
data:
  username: cmVzdGF1Y28=          # restauco
  password: Y2hhbmdlLW1l          # change-me
---
apiVersion: v1
kind: Secret
metadata:
  name: authco-secret
type: Opaque
data:
  google_client_id: Y2hhbmdlLW1l          # change-me
  google_client_secret: Y2hhbmdlLW1l      # change-me
  # AES-256 key, base64 (openssl rand -base64 32), then base64 again for the Secret
  master_key: Y2hhbmdlLW1l                # change-me
---
