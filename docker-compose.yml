# Restauco stack behind one origin (gateway). Secrets come from .env (see .env.example).
# Postgres and authco are shared with the other apps on this machine: they run in
# ../platform and are reached over its external "platform" network.
#   (cd ../platform && docker compose up -d)
#   docker compose up -d --build   ->   http://localhost:8091
services:
  restauco-api:
    restart: unless-stopped
    build: .
    image: leonard20/restauco:latest
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/restauco
      USER_DB: ${USER_DB}
      PASSWORD_DB: ${PASSWORD_DB}
      AUTHCO_ISSUER: ${PUBLIC_URL}/authco
      AUTHCO_INTERNAL_URL: http://authco:8087/authco
      RESTAUCO_RESOURCE_ID: ${PUBLIC_URL}/restauco-api
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL}
      RESTAUCO_UPLOADS: /data/uploads
      BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL:-}
    volumes:
      - uploads:/data/uploads
    networks: [default, platform]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8089/restauco-api/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5

  restauco-app:
    restart: unless-stopped
    build: ./restauco-app
    image: leonard20/restauco-app:latest
    environment:
      # Runtime config written to /config.json at container start
      API_URL: /restauco-api
      AUTH_URL: ${PUBLIC_URL}/authco
      AUTH_CLIENT_ID: restauco-app
      AUTH_RESOURCE: ${PUBLIC_URL}/restauco-api
      TENANT: toches-arepas

  gateway:
    restart: unless-stopped
    image: nginx:1.27-alpine
    depends_on:
      - restauco-api
      - restauco-app
    ports:
      - "${GATEWAY_PORT:-8091}:80"
    volumes:
      - ./deploy/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # /authco goes to the shared authco
    networks: [default, platform]

  # Public demo: Cloudflare quick tunnel to the gateway (random https://*.trycloudflare.com).
  #   docker compose --profile demo up -d tunnel && docker compose logs tunnel | grep trycloudflare
  tunnel:
    restart: unless-stopped
    image: cloudflare/cloudflared:2025.9.1
    profiles: ["demo"]
    # The gateway's internal port, the only one that trusts CF-Connecting-IP (see nginx.conf)
    command: tunnel --no-autoupdate --url http://gateway:8080
    depends_on:
      - gateway

networks:
  platform:
    external: true

volumes:
  uploads:
